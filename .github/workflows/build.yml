                      'LatitudeMTLFB':'0.2.12', 'NVMTLDriver':'0.3.19'}
          record = {}
          observed = {}

          def copy_file(src: Path, dst: Path, label: str) -> bool:
              if not src.is_file():
                  return False
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              record[label] = str(src.relative_to(root))
              return True

          def copy_tree(src: Path, dst: Path, label: str) -> bool:
              if not src.is_dir():
                  return False
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(src, dst, symlinks=True)
              record[label] = str(src.relative_to(root))
              return True

          def kext_version(src: Path) -> str | None:
              p = src / 'Contents/Info.plist'
              if not p.is_file():
                  return None
              try:
                  return str(plistlib.loads(p.read_bytes()).get('CFBundleVersion', ''))
              except (ValueError, TypeError):
                  return None

          def select_kext(candidates, version):
              found = [root / x for x in candidates if kext_version(root / x) is not None]
              return next((p for p in found if kext_version(p) == version), found[0] if found else None)

          with tempfile.TemporaryDirectory(prefix='xelpg-dev-') as tmp:
              package = Path(tmp) / 'XeLPG-7D55-Development'
              package.mkdir()
              payload = package / 'payload'
              if copy_file(root / 'desktop-build/NMXGPU-1.0.15', payload / 'Kernel/NMXGPU-1.0.15', 'NMXGPU binary'):
                  observed['NMXGPU'] = '1.0.15'
              if copy_file(root / 'desktop-build/NVMTLDriver-0.3.19', payload / 'Metal/NVMTLDriver-0.3.19', 'Metal binary'):
                  observed['NVMTLDriver'] = '0.3.19'
              # This is a debugging archive: retain legacy outputs without relabelling them.
              copy_file(root / 'desktop-build/NVMTLDriver-0.3.5', payload / 'Metal/NVMTLDriver-0.3.5', 'legacy Metal binary')
              fb = select_kext(['desktop-build/LatitudeMTLFB.kext',
                                'latitude-runtime/Library/Extensions/LatitudeMTLFB.kext',
                                'upstream-runtime/Library/Extensions/LatitudeMTLFB.kext',
                                'latitude-desktop/Library/Extensions/LatitudeMTLFB.kext'], '0.2.12')
              if fb is not None:
                  observed['LatitudeMTLFB'] = kext_version(fb)
                  copy_tree(fb, payload / 'Library/Extensions/LatitudeMTLFB.kext', 'framebuffer kext')
              accel = select_kext(['accel-build/NMXAccel.kext',
                                   'latitude-runtime/Library/Extensions/NMXAccel.kext',
                                   'upstream-runtime/Library/Extensions/NMXAccel.kext',
                                   'latitude-desktop/Library/Extensions/NMXAccel.kext'], '0.2.9')
              if accel is not None:
                  observed['NMXAccel'] = kext_version(accel)
                  copy_tree(accel, payload / 'Library/Extensions/NMXAccel.kext', 'accelerator kext')
              copy_tree(root / 'latitude-desktop/EFI-Kexts/LatitudePanelClaim.kext',
                        payload / 'EFI/OC/Kexts/LatitudePanelClaim.kext', 'panel claim')
              for key in ['latitude-runtime/NVMTLDriver.bundle', 'upstream-runtime/NVMTLDriver.bundle']:
                  if copy_tree(root / key, payload / 'Metal/NVMTLDriver.bundle', 'Metal bundle template'):
                      break
              for key in ['NullMoth/translator/translator/target/release/libnvmtl_translate.dylib',
                          'NullMoth/translator/target/release/libnvmtl_translate.dylib']:
                  if copy_file(root / key, payload / 'Runtime/lib/libnvmtl_translate.dylib', 'AIR translator'):
                      break
              prefix = Path(os.environ.get('XELPG_PREFIX', '/nonexistent-xelpg-prefix'))
              if prefix.is_absolute() and prefix.is_relative_to(root):
                  copy_tree(prefix / 'lib', payload / 'Runtime/staged-lib', 'ANV/libdrm')
              elif prefix.is_absolute() and (prefix / 'lib').is_dir():
                  # Prefix is normally in RUNNER_TEMP (outside workspace).
