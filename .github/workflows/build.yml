          #!/usr/bin/env python3
          """Fail-closed macOS Xe-LPG 7D55 runtime packaging.
          
          Runs on macOS CI after all independent builds. Missing or stale runtime
          components cause failure, never an apparently install-ready archive.
          """
          from __future__ import annotations
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile
          
          REQUIRED_ACCEL_VERSION = '0.2.9'
          REQUIRED_PLUGIN_VERSION = '0.3.19'
          REQUIRED_FB_VERSION = '0.2.12'
          REQUIRED_KERNEL_VERSION = '1.0.15'
          ID_7D55 = '0x7d558086'
          ID_7D45 = '0x7d458086'
          
          class PackageError(Exception):
              pass
          
          def check(test: bool, reason: str):
              if not test:
                  raise PackageError(reason)
          
          def readplist(path: Path) -> dict:
              check(path.is_file(), f'Missing Info.plist: {path}')
              return plistlib.loads(path.read_bytes())
          
          def mac_macho(path: Path):
              check(path.is_file() and path.stat().st_size > 0, f'Missing executable: {path}')
              # file(1) is authoritative for type and CPU architecture on the CI runner.
              if sys.platform == 'darwin':
                  result = subprocess.check_output(['/usr/bin/file', '-b', str(path)], text=True)
                  check('Mach-O' in result and 'x86_64' in result,
                        f'Not a Mach-O x86_64 executable: {path} ({result.strip()})')
          
          def matches(pl: dict) -> str:
              return ' '.join(str(v).lower() for d in pl.get('IOKitPersonalities', {}).values()
                              for k,v in d.items() if 'match' in k.lower())
          
          def kext_valid(path: Path, *, dual=False, expected_version=None):
              p = readplist(path / 'Contents' / 'Info.plist')
              exe = p.get('CFBundleExecutable')
              check(isinstance(exe, str) and exe.strip(), f'{path}: CFBundleExecutable unset')
              mac_macho(path / 'Contents' / 'MacOS' / exe)
              check(p.get('CFBundleIdentifier'), f'{path}: bundle identifier missing')
              if dual:
                  m = matches(p)
                  check(ID_7D55 in m and ID_7D45 in m,
                        f'{path}: missing dual-ID PCI match (7D45 and 7D55): {m!r}')
              if expected_version:
                  actual = str(p.get('CFBundleVersion', ''))
                  check(actual == expected_version,
                        f'{path}: version {actual!r} != required {expected_version!r}')
              return p
          
          def copytree(src, dest):
              check(src.is_dir(), f'Missing directory: {src}')
              shutil.copytree(src, dest, symlinks=True)
          
          def find_kext(root: Path, name: str, version: str | None = None) -> Path:
              # Search only known build/output roots. No silent downgrade or unrelated
              # prebuilt system kexts; each selected binary is validated and recorded.
              roots = [root / 'desktop-build', root / 'accel-build',
                       root / 'latitude-runtime', root / 'latitude-desktop',
                       root / 'upstream-runtime', root / 'NullMoth' / 'kexts']
              candidates=[]
              for base in roots:
                  if base.is_dir():
                      candidates.extend(p for p in base.rglob(name + '.kext')
                                        if p.is_dir() and (p / 'Contents/Info.plist').is_file())
              candidates=list(dict.fromkeys(candidates))
              qualified=[]
              for p in candidates:
                  try:
                      kext_valid(p, expected_version=version)
                      qualified.append(p)
                  except PackageError:
                      continue
              check(qualified, f'{name}.kext version {version or "any"} not found as a complete x86_64 bundle in build/output roots. Found candidates: {[str(p) for p in candidates]}. Build it or sync compatible runtime sources; do not substitute an old binary.')
              return qualified[0]
          
          def sign_kext(kext: Path):
              if sys.platform == 'darwin':
                  subprocess.run(['codesign', '--force', '--sign', '-', '--timestamp=none', str(kext)], check=True)
                  subprocess.run(['codesign', '--verify', '--verbose=1', str(kext)], check=True)
          
