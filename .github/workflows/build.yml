          #!/usr/bin/env python3
          """Publish CI build outputs without claiming the experimental GPU port is installable."""
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import shutil
          import sys
          import tempfile
          import zipfile

          root = Path.cwd().resolve()
          run = os.environ.get('GITHUB_RUN_NUMBER', 'local')
          sha = os.environ.get('GITHUB_SHA', 'unknown')
