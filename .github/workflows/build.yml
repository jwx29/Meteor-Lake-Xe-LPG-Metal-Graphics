                  record['ANV/libdrm'] = str(prefix / 'lib')
              copy_tree(root / 'firmware/i915', payload / 'Firmware/i915', 'Intel i915 firmware')
              copy_tree(root / 'latitude-runtime/tools', package / 'tests/upstream-tools', 'upstream GPU tests')
              for name in ('test-readback.sh', 'collect-desktop-failure.sh', 'install-windowserver.sh'):
                  copy_file(root / 'latitude-desktop' / name, package / 'references' / name, f'upstream {name}')
              copy_file(root / 'latitude-runtime/rollback-runtime.sh', package / 'references/rollback-runtime.sh', 'upstream rollback')
              copy_file(root / 'firmware/LICENSE.i915', package / 'licenses/LICENSE.i915', 'firmware license')
              copy_file(root / 'LICENSE', package / 'licenses/LICENSE', 'project license')
              mismatches = [f'{name}: {observed.get(name, "missing")} (needs {version})'
                            for name, version in expected.items() if observed.get(name) != version]
              info = {
                  'type': 'DEVELOPMENT-ONLY / NOT INSTALL-READY',
                  'commit': sha, 'required_versions': expected, 'observed_versions': observed,
                  'missing_or_incompatible': mismatches, 'sources': record,
                  'hardware_tested_8086_7d55': False,
                  'warning': 'Do not inject kexts, replace WindowServer, or modify OpenCore using this archive.'
              }
              (package / 'build-manifest.json').write_text(json.dumps(info, indent=2) + '\n')
              (package / 'README.md').write_text(
                  '# Xe-LPG 7D55 — development outputs, NOT an installer\n\n'
                  'This contains real CI binaries and any available runtime components.\n'
                  'The included framebuffer may be legacy 0.2.3; binaries have not been relabelled.\n'
                  'Do not install these kexts or enable experimental GPU acceleration.\n'
                  'Use the separately uploaded XeLPG-7D55-Install artifact only if the strict compatibility gate passes.\n'
                  'Read build-manifest.json to see exactly what is missing.\n'
                  'The files under references/ are for study, not an automated installer.\n\n'
                  'Missing or incompatible components:\n' +
                  '\n'.join('- ' + m for m in mismatches) + '\n'
              )
              inspector = package / 'inspect.sh'
              inspector.write_text('''#!/bin/bash
          set -euo pipefail
          cd "$(dirname "$0")"
          echo 'Checking archive content integrity'
          shasum -a 256 -c SHA256SUMS.txt
          echo 'Build manifest:'
          cat build-manifest.json
          if command -v system_profiler >/dev/null 2>&1; then
              system_profiler SPDisplaysDataType || true
          fi
          if command -v kmutil >/dev/null 2>&1; then
              kmutil showloaded | grep -Ei 'NMX|Latitude' || true
          fi
          echo 'DEVELOPMENT BUILD ONLY: no installation performed.'
          ''')
              inspector.chmod(0o755)
              installer = package / 'install.sh'
              installer.write_text('''#!/bin/bash
          echo 'REFUSED: This is a development artifact, NOT an installation-ready runtime.' >&2
          echo 'Obtain the separate verified XeLPG-7D55-Install package if it becomes available.' >&2
          exit 2
          ''')
              installer.chmod(0o755)
              files = (f for f in sorted(package.rglob('*')) if f.is_file() and not f.is_symlink() and f.name != 'SHA256SUMS.txt')
              (package / 'SHA256SUMS.txt').write_text('\n'.join(
                  f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.relative_to(package)}' for f in files) + '\n')
              target.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
                  for f in sorted(package.rglob('*')):
                      if f.is_dir():
                          continue
                      arc = str(f.relative_to(package.parent))
                      if f.is_symlink():
                          out = zipfile.ZipInfo(arc)
                          out.create_system = 3
                          out.external_attr = (0o120777 << 16)
                          z.writestr(out, os.readlink(f))
                      else:
                          z.write(f, arc)
              with zipfile.ZipFile(target) as z:
                  assert z.testzip() is None
                  assert 'XeLPG-7D55-Development/build-manifest.json' in z.namelist()
              print('Created:', target, f'({target.stat().st_size:,} bytes)')
              print('Actual versions:', observed)
              print('Not install-ready:', mismatches)
          XELPG_DEV_PACKAGER
          python3.14 ci-package-tools/make-dev-zip.py 2>&1 | tee ci-logs/development-package.log
          unzip -t ci-install/XeLPG-7D55-Development-${{ github.run_number }}.zip | tail -n 1

      - name: Upload development ZIP (not install-ready)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XeLPG-7D55-Development-${{ github.run_number }}
          path: ci-install/XeLPG-7D55-Development-${{ github.run_number }}.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified installation ZIP
        if: ${{ success() && steps.install_package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: XeLPG-7D55-Install-${{ github.run_number }}
          path: |
            ci-install/XeLPG-7D55-Sequoia-x86_64.zip
            ci-install/ZIP-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Package CI results (no USB publishing or install)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          for dir in \
            ci-logs desktop-build ci-package-tools ci-install \
            latitude-desktop/Library/Extensions latitude-desktop/EFI-Kexts \
            NullMoth/gpu-port/xkpi/logs NullMoth/gpu-port/xkpi/logs-i915 \
            build-tree/mesa-build/meson-logs build-tree/drm-build/meson-logs; do
            if [ -d "$dir" ]; then
              mkdir -p "ci-artifacts/$(dirname "$dir")"
              cp -R "$dir" "ci-artifacts/$dir"
            fi
          done
          mkdir -p ci-artifacts/kernel-debug ci-artifacts/staged
          for name in all.sh all-i915.sh cc.sh cc-i915.sh one.sh \
                      fork_i915_gem_mman.py filter_intel_drm_sources.py srcs-excluded-amd.txt \
                      srcs.all srcs.txt srcs-i915.all srcs-i915.txt; do
            source="NullMoth/gpu-port/xkpi/$name"
            [ ! -f "$source" ] || cp "$source" "ci-artifacts/kernel-debug/$name"
          done
          if [ -d "$RUNNER_TEMP/xelpg-deps/lib" ]; then
            cp -R "$RUNNER_TEMP/xelpg-deps/lib" ci-artifacts/staged/lib
          fi
          printf 'commit=%s\nrepo=%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > ci-artifacts/build-info.txt
          sw_vers >> ci-artifacts/build-info.txt

      - name: Upload compiled binaries and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xelpg-macos15-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
