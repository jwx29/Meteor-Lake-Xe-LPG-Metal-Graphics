          #!/bin/bash
          # Restore kexts staged by this package. No automatic reboot or EFI change.
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          state='/Library/Application Support/XeLPG-7D55'
          if [[ ${1:-} != --restore ]]; then
           echo 'Usage: sudo ./rollback.sh --restore'
           exit 2
          fi
          if [[ $EUID -ne 0 ]]; then
           echo 'Run via sudo to restore kexts' >&2; exit 2
          fi
          marker="$state/last-backup.txt"
          [[ -f "$marker" ]] || { echo 'No staged kext backup recorded.' >&2; exit 1; }
          backup="$(cat "$marker")"
          [[ "$backup" == "$state"/backups/* && -d "$backup" ]] || {
           echo "Unexpected backup path: $backup" >&2; exit 1;
          }
          while IFS=$'\t' read -r name action; do
           case "$name" in NMXGPU|NMXAccel|LatitudeMTLFB) ;; *) echo 'Invalid backup manifest' >&2; exit 1;; esac
           dest="/Library/Extensions/$name.kext"
           case "$action" in
             old) [[ -d "$backup/$name.kext" ]] || { echo "Missing backup for $name" >&2; exit 1; }; rm -rf "$dest"; ditto "$backup/$name.kext" "$dest";;
             new) rm -rf "$dest";;
             *) echo 'Invalid backup manifest action' >&2; exit 1;;
           esac
          done < "$backup/restore-list.txt"
          if [[ -d "$backup/runtime" ]]; then
            rm -rf "$state/runtime"
            ditto "$backup/runtime" "$state/runtime"
          elif [[ -e "$backup/runtime-was-missing" ]]; then
            rm -rf "$state/runtime"
          fi
          kmutil install --volume-root / --update-all
          rm -f "$marker"
          echo 'Previous kexts restored; EFI/OpenCore and WindowServer changes must be reversed separately.'
          echo 'Reboot only after reviewing boot configuration. No reboot was performed.'
