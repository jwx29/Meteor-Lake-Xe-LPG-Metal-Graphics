          #!/usr/bin/env python3
          """Offline packager fixture. No macOS runtime, root, or GPU required."""
          from pathlib import Path
          import hashlib
          import json
          import os
          import plistlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile
          
          here = Path(__file__).resolve().parent
          packager = here / 'packager.py'
          
          if sys.platform == 'darwin':
              with tempfile.TemporaryDirectory() as cc_temp:
                  stub = Path(cc_temp)
                  (stub/'stub.c').write_text('int xelpg_dummy(void) { return 0; }\n')
                  subprocess.run(['xcrun','clang','-arch','x86_64','-dynamiclib',
                                  str(stub/'stub.c'),'-o',str(stub/'stub.dylib')],check=True)
                  MACHO_BYTES = (stub/'stub.dylib').read_bytes()
          else:
              MACHO_BYTES = b'FAKE_MACHO_x86_64'
          
          def write(path, b=None):
              if b is None:
                  b = MACHO_BYTES
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(b)
          
          def plist(path, executable, version, matches=None):
              d={'CFBundleExecutable':executable,'CFBundleIdentifier':'com.nullmoth.test.'+executable,
                 'CFBundleVersion':version,'CFBundleShortVersionString':version,'CFBundlePackageType':'BNDL' if executable=='NVMTLDriver' else 'KEXT'}
              if matches:
                  d['IOKitPersonalities']={'Test':{'IOPCIMatch':matches}}
              write(path,plistlib.dumps(d))
          
          def kext(root, name, version, matches=None):
              d=root/name/'Contents'
              plist(d/'Info.plist', name.removesuffix('.kext'), version, matches)
              write(d/'MacOS'/name.removesuffix('.kext'))
          
          with tempfile.TemporaryDirectory() as tmp:
              r=Path(tmp)
              write(r/'desktop-build/NMXGPU-1.0.15')
              write(r/'desktop-build/NVMTLDriver-0.3.19')
              plist(r/'latitude-runtime/NVMTLDriver.bundle/Contents/Info.plist', 'NVMTLDriver', '0.3.19')
              write(r/'latitude-runtime/NVMTLDriver.bundle/Contents/MacOS/NVMTLDriver')
              write(r/'latitude-desktop/install-windowserver.sh',b'#!/bin/bash\n')
              write(r/'latitude-runtime/rollback-runtime.sh',b'#!/bin/bash\n')
              plist(r/'NullMoth/gpu-port/xkpi/kext/Info.plist', 'NMXGPU','1.0.15',
                    '0x7d458086 0x7d558086')
              kext(r/'accel-build','NMXAccel.kext','0.2.9')
              kext(r/'desktop-build','LatitudeMTLFB.kext','0.2.12')
              kext(r/'latitude-desktop/EFI-Kexts','LatitudePanelClaim.kext','0.2.3',
                   '0x7d458086 0x7d558086')
              write(r/'NullMoth/translator/translator/target/release/libnvmtl_translate.dylib')
              for fw in ('mtl_guc_70.bin','mtl_dmc.bin','mtl_huc_gsc.bin','mtl_gsc_1.bin'):
                  write(r/'firmware/i915'/fw,b'fw')
