          # Xe-LPG 7D55 — experimental macOS Sequoia installation package
          
          This package is built by your fork's GitHub Actions run, not a vetted Dell release.
          The supported PCI identities in the kernel and panel-claim plists must both include
          `8086:7D55` and `8086:7D45`. The `build-manifest.json` records component versions,
          source commit, and selected binary paths; `SHA256SUMS.txt` covers all package files.
          
          ## Before installing
          
          * macOS **15.x Sequoia x86_64** only.
          * **Back up the entire disk and EFI**, keep a bootable working OpenCore USB and a
            nonaccelerated boot option. Experimental graphics can cause a boot loop or panic.
          * Confirm your laptop's PCI ID is really 8086:7D55 and hardware/firmware/ACPI
            assumptions are correct. Dell-specific panel identifiers are **not** universal.
          * Understand upstream's security prerequisites, SIP, AMFI, and Auxiliary Kernel
            Collection setup. This package does not silently disable security protections.
          * Check current upstream instructions before changing WindowServer. Full hardware
            validation is only possible on the target laptop, not GitHub's CI runner.
          
          ## Layout
          
          * `payload/Library/Extensions` — NMXGPU.kext, NMXAccel.kext, LatitudeMTLFB.kext.
          * `payload/EFI/OC/Kexts/LatitudePanelClaim.kext` — candidate for **manual** OpenCore
            integration. Add it to `config.plist` and check load order only after backing up EFI.
          * `payload/Metal` — compiled NVMTLDriver 0.3.19 and possibly its upstream bundle
            template. The upstream one-shot runtime installer controls actual Metal activation.
          * `payload/Runtime/lib` — freshly built ANV, libdrm, and AIR-to-SPIR-V translator; library paths require the
            upstream runtime staging/launcher to resolve correctly.
          * `payload/Firmware/i915` — firmware sources to stage as upstream requires.
          * `upstream/latitude-runtime`, `upstream/latitude-desktop`, `upstream/desktop-sources`
            — accompanying upstream scripts and tests. They may refer to the original Dell's
            USB paths and **must not be run blindly** on another laptop.
          
          ## Commands on your Hackintosh
          
          ```bash
          cd XeLPG-7D55
          ./install.sh --check       # offline static manifest and OS verification
          ./test.sh --static         # checksums and Mach-O checks, no system changes
          ```
          
          First edit **OpenCore** manually: use a backed-up EFI, stage
          `LatitudePanelClaim.kext` under `EFI/OC/Kexts`, add matching Kernel/Add entry,
          keep the previously working boot entry, and verify macOS still boots *without*
          activating GPU acceleration. Do not replace unrelated Wi-Fi/touchpad/ACPI kexts.
          
          If you elect to stage kernel extensions (not a complete GPU activation):
          
          ```bash
          sudo env XELPG_ACCEPT_EXPERIMENTAL=YES ./install.sh --stage
          # then type 7D55 to confirm the experimental target PCI ID
          ```
          
          That backs up existing kexts, stages the three kexts in `/Library/Extensions`,
          places userspace libraries under `/Library/Application Support/XeLPG-7D55/runtime`,
          then runs `kmutil install --volume-root / --update-all`. It **does not** install
          WindowServer hooks, modify OpenCore, disable SIP/AMFI, set NVRAM, or reboot.
          It intentionally does **not** advertise full graphics enablement at this point.
          For the final system-level plugin activation follow the source project's manual,
          one-shot `install-windowserver.sh` sequence after adapting Dell/USB paths.
          
          Rollback staged kexts (from working Sequoia or Recovery with the target volume
          mounted at `/`; adapt the paths appropriately):
          
          ```bash
          sudo ./rollback.sh --restore
          ```
          
          The rollback covers only the kexts touched by this packager. Any manual EFI,
          security, or WindowServer changes require their own manual rollback; the upstream
          `latitude-runtime/rollback-runtime.sh` addresses its own runtime changes.
          
          Hardware diagnostics and optional Vulkan/Metal tests after a successful boot:
          
          ```bash
          ./test.sh --live
          ```
          
          **Limitations:** A CI `PASS` verifies static packaging, build versions, Mach-O
          architecture, code signatures and hashes. It does not prove your 7D55 laptop can
          load NMXGPU, initialise firmware, use Metal/Vulkan, or safely accelerate WindowServer.
          
          ## CI provenance and important limits
          
          The NMXGPU executable and staged Mesa/DRM libraries were built by this CI run.
          NMXAccel, framebuffer and some plugin runtime templates may come from the
          checked-out repository; their versions and Mach-O format are validated, but
          they are NOT necessarily rebuilt by this workflow. See build-manifest.json
          for exact paths. No CI runner can validate 7D55 hardware attachment or
          Dell-specific framebuffer/ACPI assumptions. Never treat static PASS as a
          reason to enable automatic boot activation.
          XELPG_EMBEDDED_6_END
