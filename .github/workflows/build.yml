name: Build Xe-LPG graphics stack (fork)

on:
  workflow_dispatch:
    inputs:
      kernel_linker:
        description: 'Kernel linker revision (auto, 1.0.15 or 1.0.14)'
        required: false
        default: auto
        type: choice
        options: [auto, '1.0.15', '1.0.14']
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xelpg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS 15 Intel · 7D45/7D55
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Checkout fork (never merge upstream automatically)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m pip install --upgrade pip
          python3.14 -m pip install 'meson>=1.9,<1.13' ninja packaging setuptools wheel Mako PyYAML ply pycparser
          python3.14 - <<'PY'
          import sys, mesonbuild, packaging, mako, yaml, ply, pycparser
          print('Python:', sys.executable)
          print('Mako:', mako.__version__)
          print('PyYAML:', yaml.__version__)
          PY

      - name: Install macOS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install pkg-config cmake bison flex llvm spirv-tools glslang spirv-llvm-translator libclc rust
          for formula in llvm spirv-tools glslang bison flex rust spirv-llvm-translator; do
            echo "$(brew --prefix "$formula")/bin" >> "$GITHUB_PATH"
          done
          prefix="$RUNNER_TEMP/xelpg-deps"
          llvm="$(brew --prefix llvm)"
          libclc="$(brew --prefix libclc)"
          spirv="$(brew --prefix spirv-tools)"
          translator="$(brew --prefix spirv-llvm-translator)"
          echo "XELPG_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$llvm/bin/llvm-config" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$llvm:$libclc:$spirv:$translator:$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$prefix/share/pkgconfig:$llvm/lib/pkgconfig:$libclc/lib/pkgconfig:$libclc/share/pkgconfig:$spirv/lib/pkgconfig:$translator/lib/pkgconfig" >> "$GITHUB_ENV"
          mkdir -p "$prefix" ci-logs desktop-build build-tree

      - name: Check toolchain and input tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sw_vers
          xcodebuild -version
          xcrun --find clang
          python3.14 -c 'import packaging, mako, yaml, ply, pycparser'
          meson --version
          ninja --version
          "$LLVM_CONFIG" --version
          command -v llvm-dis
          command -v spirv-val
          command -v glslangValidator
          command -v llvm-spirv
          command -v bison
          command -v flex
          command -v cargo
          test -f MacKernelSDK/.gitignore || test -d MacKernelSDK
          test -d drm-kmod
          test -d freebsd-src
          test -d mesa
          test -d libdrm
          test -f NullMoth/gpu-port/xkpi/all.sh
          test -f NullMoth/gpu-port/xkpi/all-i915.sh
          test -f NullMoth/gpu-port/xkpi/cc.sh
          test -f NullMoth/gpu-port/xkpi/cc-i915.sh
          test -f NullMoth/gpu-port/xkpi/amd.flags
          test -f NullMoth/translator/translator/Cargo.toml
          test -f desktop-sources/build.py
          echo 'Kernel linker scripts present:'
          find desktop-sources -maxdepth 1 -name 'link-kernel-*.py' -print
          echo 'Plugin build scripts present:'
          find desktop-sources -maxdepth 1 -name 'build-windowserver-*.py' -print

      - name: Audit available install-runtime components before the long build
        shell: bash
        run: |
          set -euo pipefail
          python3.14 - <<'PY'
          from pathlib import Path
          import plistlib
          root=Path.cwd()
          expected={
              'LatitudeMTLFB': ('0.2.12', [
                  'desktop-build/LatitudeMTLFB.kext',
                  'latitude-runtime/Library/Extensions/LatitudeMTLFB.kext',
                  'upstream-runtime/Library/Extensions/LatitudeMTLFB.kext',
                  'latitude-desktop/Library/Extensions/LatitudeMTLFB.kext']),
              'NMXAccel': ('0.2.9', [
                  'accel-build/NMXAccel.kext',
                  'latitude-runtime/Library/Extensions/NMXAccel.kext',
                  'upstream-runtime/Library/Extensions/NMXAccel.kext']),
          }
          for component,(required,paths) in expected.items():
              found=[]
              for rel in paths:
                  path=root/rel/'Contents/Info.plist'
                  if path.is_file():
                      pl=plistlib.loads(path.read_bytes())
                      found.append((rel,str(pl.get('CFBundleVersion','unknown'))))
              print(component, 'available:', found or 'none')
              if not any(version==required for _,version in found):
                  print(f'::warning::{component} {required} not available in the checked-out runtime. '
                        'The build may succeed, but verified installation packaging will not pass. '
                        'A development ZIP will still be uploaded.')
          if (root/'desktop-sources/build.py').is_file():
              source=(root/'desktop-sources/build.py').read_text()
              if "'0.2.3'" in source and "'0.2.12'" not in source:
                  print('::notice::The current framebuffer builder stamps 0.2.3, not 0.2.12. '
                        'Do not relabel it; this is not the complete newer framebuffer.')
          PY

      - name: Verify dual GPU PCI matching
        shell: bash
        run: |
          set -euo pipefail
          python3.14 - <<'PY'
          from pathlib import Path
          import plistlib
          path = Path('NullMoth/gpu-port/xkpi/kext/Info.plist')
          data = plistlib.loads(path.read_bytes())
          matches = ' '.join(
              str(v) for p in data.get('IOKitPersonalities', {}).values()
              for k, v in p.items() if 'match' in k.lower()
          ).lower()
          print('PCI matching entries:', matches)
          required = ('0x7d458086', '0x7d558086')
          absent = [x for x in required if x not in matches]
          if absent:
              raise SystemExit(f'{path} does not contain both PCI matches; missing: {absent}. Commit your 7D55 patches to the fork before building.')
          PY

      - name: Build AIR to SPIR-V translator
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path NullMoth/translator/translator/Cargo.toml \
            2>&1 | tee ci-logs/translator.log

      - name: Build and install patched libdrm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-tree/drm-build
          meson setup build-tree/drm-build libdrm \
            --buildtype=release --prefix="$XELPG_PREFIX" \
            -Dintel=disabled -Damdgpu=disabled -Dradeon=disabled \
            -Dnouveau=disabled -Dvmwgfx=disabled \
            2>&1 | tee ci-logs/libdrm-configure.log
          meson compile -C build-tree/drm-build 2>&1 | tee ci-logs/libdrm-compile.log
          meson install -C build-tree/drm-build 2>&1 | tee ci-logs/libdrm-install.log
          pkg-config --modversion libdrm

      - name: Build Mesa Intel ANV for macOS
        shell: bash
        run: |
          set -euo pipefail
          echo "LLVM: $("$LLVM_CONFIG" --version)"
          echo "libdrm: $(pkg-config --modversion libdrm)"
          glslangValidator --version | head -n 2
          rm -rf build-tree/mesa-build
          meson setup build-tree/mesa-build mesa \
            --buildtype=release --prefix="$XELPG_PREFIX" \
            -Dvulkan-drivers=intel -Dplatforms=macos -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dglvnd=disabled \
            -Dopengl=false -Dllvm=enabled \
            2>&1 | tee ci-logs/mesa-configure.log
          meson compile -C build-tree/mesa-build 2>&1 | tee ci-logs/mesa-compile.log
          meson install -C build-tree/mesa-build 2>&1 | tee ci-logs/mesa-install.log
          find "$XELPG_PREFIX" -name '*vulkan*intel*' -o -name 'libdrm*.dylib' | head -n 30

      - name: Build Metal plugin (prefer current 0.3.19 candidate)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f desktop-sources/build-windowserver-0.3.19.py ]; then
            script=desktop-sources/build-windowserver-0.3.19.py
          else
            script=desktop-sources/build-windowserver-0.3.5.py
            echo 'WARNING: 0.3.19 builder is absent. The build can finish, but install-ready packaging will be blocked.' >&2
          fi
          test -f "$script" || { echo "Missing plugin builder: $script" >&2; exit 1; }
          echo "$script" | tee ci-logs/plugin-builder.txt
          python3.14 "$script" 2>&1 | tee ci-logs/plugin.log

      - name: Make upstream kernel paths portable and filter Intel DRM
        shell: bash
        run: |
          set -euo pipefail
          python3.14 - <<'PY'
          from pathlib import Path
          import re
          root = Path.cwd().resolve()
          xkpi = root / 'NullMoth/gpu-port/xkpi'
          # Important: upstream calls the parent of drm-kmod / freebsd-src
          # 'kpi'. In this repository that parent is the *repository root*.
          mappings = [
              ('/Volumes/MiniData/build/gpu-src/xkpi', str(xkpi)),
              ('/Volumes/MiniData/build/gpu-src/kpi', str(root)),
              ('/Users/ved/igpu-build/xkpi', str(xkpi)),
              ('/Users/ved/igpu-build/kpi', str(root)),
              ('/Volumes/MiniData/build/gpu-src', str(root)),
              ('/Users/ved/igpu-build', str(root)),
              ('/opt/homebrew/bin/python3', 'python3.14'),
          ]
          # Do not rewrite all Python scripts, only compiler & source-list
          # helpers plus linker scripts that can contain machine paths.
          targets = [xkpi / x for x in ('all.sh', 'all-i915.sh', 'cc.sh', 'cc-i915.sh',
                                       'one.sh', 'srclist.py', 'fork_i915_gem_mman.py', 'amd.flags')]
          targets += sorted((root / 'desktop-sources').glob('link-kernel-*.py'))
          for path in targets:
              if not path.exists():
                  if path.name in ('srclist.py', 'fork_i915_gem_mman.py', 'one.sh'):
                      raise SystemExit(f'Kernel helper missing: {path}')
                  continue
              original = path.read_text()
              updated = original
              for old, new in mappings:
                  updated = updated.replace(old, new)
              # compiler_types.h includes <compat/linuxkpi/common/include/...>.
              # -I$L/common/include cannot resolve that prefixed path; the
              # correct include root is freebsd-src/sys. Keep it *after*
              # Kernel.framework so native macOS headers retain priority.
              if path.name in ('cc.sh', 'cc-i915.sh'):
                  flag = '-I$K/freebsd-src/sys'
                  if flag not in updated:
                      # Both compiler entrypoints put -I$KF immediately before
                      # "$@"; anchor here rather than modifying other -I order.
                      anchor = '-I$KF "$@"'
                      if anchor not in updated:
                          raise SystemExit(f'Unexpected compiler command in {path}: missing {anchor!r}')
                      updated = updated.replace(anchor, f'-I$KF {flag} "$@"', 1)
              # Include compiler-argument paths embedded in flags too.
              if updated != original:
                  path.write_text(updated)
              print(('patched' if updated != original else 'checked'), path.relative_to(root))
          for path in [xkpi / 'all.sh', xkpi / 'all-i915.sh',
                       xkpi / 'cc.sh', xkpi / 'cc-i915.sh']:
              s = path.read_text()
              for old, _ in mappings:
                  if old in s:
                      raise SystemExit(f'Unresolved developer path {old} in {path}')
          mandatory = [xkpi / 'bsdcompat/include/nmxkpi_prelude.h',
                       root / 'freebsd-src/sys/compat/linuxkpi/common/include/linux/compiler_types.h',
                       root / 'freebsd-src/sys/compat/linuxkpi/common/include/linux/compiler_attributes.h',
                       root / 'drm-kmod/drivers/gpu/drm/drm_client.c',
                       root / 'drm-kmod/drivers/gpu/drm/drm_client_modeset.c',
                       root / 'drm-kmod/drivers/gpu/drm/drm_panel_orientation_quirks.c',
                       root / 'drm-kmod/drivers/gpu/drm/drm_mipi_dsi.c',
                       root / 'drm-kmod/drivers/gpu/drm/i915/gem/i915_gem_mman.c']
          absent = [str(p) for p in mandatory if not p.is_file()]
          if absent:
              raise SystemExit('Missing compiler sources:\n' + '\n'.join(absent))
          for directory in ('obj','obj-i915','logs','logs-i915','lkobj','srcobj','xnuobj'):
              (xkpi / directory).mkdir(exist_ok=True)
          PY
          # The upstream all.sh enumerates AMDGPU plus DRM/TTM; NMXGPU's
          # frozen 438-object link must not include AMDGPU objects.
          python3.14 - <<'PY'
          from pathlib import Path
          import textwrap
          xkpi = Path('NullMoth/gpu-port/xkpi')
          helper = xkpi / 'filter_intel_drm_sources.py'
          helper.write_text(textwrap.dedent('''\
          #!/usr/bin/env python3
          from pathlib import Path
          from collections import Counter
          import sys

          srcfile = Path(sys.argv[1])
          sources = [s for s in srcfile.read_text().splitlines() if s.strip()]
          def category(s):
              stem = Path(s).stem
              if stem.startswith('drm_'): return 'drm'
              if stem.startswith('ttm_'): return 'ttm'
              if stem in ('dma-fence', 'dma-fence-array', 'dma-fence-chain', 'dma-resv'): return 'dma'
              if stem.startswith('sched_'): return 'sched'
              return None

          wanted = [s for s in sources if category(s)]
          excluded = [s for s in sources if not category(s)]
          got = dict(Counter(category(s) for s in wanted))
          expected = {'drm': 69, 'ttm': 11, 'dma': 4, 'sched': 3}
          if got != expected:
              raise SystemExit(f'DRM source manifest changed: {got}, expected {expected}; review upstream changes')
          if len({Path(s).stem for s in wanted}) != len(wanted):
              raise SystemExit('Selected DRM files have duplicate object basenames')
          if any(not Path(s).is_file() for s in wanted):
              raise SystemExit('Selected DRM source files missing')
          Path('srcs-excluded-amd.txt').write_text('\\n'.join(excluded) + '\\n')
          srcfile.write_text('\\n'.join(wanted) + '\\n')
          print(f'Intel NMXGPU DRM manifest: {len(wanted)} sources; {len(excluded)} unrelated sources excluded')
          '''))
          compiler = xkpi / 'all.sh'
          code = compiler.read_text()
          needle = "n=$(wc -l < srcs.txt | tr -d ' ')"
          instruction = 'python3 "$X/filter_intel_drm_sources.py" srcs.txt || exit 1'
          if instruction not in code:
              if code.count(needle) != 1:
                  raise SystemExit('Upstream all.sh source-list boundary changed; cannot inject filter')
              code = code.replace(needle, instruction + '\n' + needle, 1)
              compiler.write_text(code)
          print('Patched all.sh to compile only 87 shared DRM objects')
          PY
          for script in all.sh all-i915.sh cc.sh cc-i915.sh one.sh; do
            bash -n "NullMoth/gpu-port/xkpi/$script"
          done
          echo 'Compiler include flags:'
          grep -o -- '-I\$K/freebsd-src/sys' NullMoth/gpu-port/xkpi/cc.sh NullMoth/gpu-port/xkpi/cc-i915.sh

      - name: Namespace LinuxKPI UUID helpers after XNU headers
        shell: bash
        run: |
          set -euo pipefail
          python3.14 - <<'PY'
          from pathlib import Path

          xkpi = Path('NullMoth/gpu-port/xkpi')
          include = xkpi / 'bsdcompat/include'
          shim = include / 'nmxkpi_linux_uuid_namespace.h'
          # The native macOS UUID functions have already been declared by
          # nmxkpi_prelude.h (which includes the Apple kernel headers).
          # FreeBSD LinuxKPI supplies *different* uuid_copy/uuid_is_null/
          # uuid_parse signatures. Give the Linux-side inline helpers their
          # own names, including their callers, without editing Apple SDKs.
          shim.write_text('''/* LinuxKPI UUID helpers must not collide with Apple's UUID API. */
          #ifndef NMXKPI_LINUX_UUID_NAMESPACE_H
          #define NMXKPI_LINUX_UUID_NAMESPACE_H
          #define uuid_copy nmx_linuxkpi_uuid_copy
          #define uuid_is_null nmx_linuxkpi_uuid_is_null
          #define uuid_parse nmx_linuxkpi_uuid_parse
          #endif
          ''' )

          for script_name in ('cc.sh', 'cc-i915.sh'):
              script = xkpi / script_name
              body = script.read_text()
              anchor = '-include $X/bsdcompat/include/nmxkpi_prelude.h'
              inject = '-include $X/bsdcompat/include/nmxkpi_linux_uuid_namespace.h'
              if inject not in body:
                  if body.count(anchor) != 1:
                      raise SystemExit(f'Cannot locate forced-prelude include in {script}')
                  body = body.replace(anchor, anchor + ' ' + chr(92) + chr(10) + '  ' + inject, 1)
                  script.write_text(body)
              print(f'{script}: LinuxKPI UUID functions namespaced after XNU prelude')
          PY
          bash -n NullMoth/gpu-port/xkpi/cc.sh
          bash -n NullMoth/gpu-port/xkpi/cc-i915.sh
          grep -n 'nmxkpi_linux_uuid_namespace.h' NullMoth/gpu-port/xkpi/cc.sh NullMoth/gpu-port/xkpi/cc-i915.sh

      - name: Preflight shared DRM include tree
        shell: bash
        run: |
          set -euo pipefail
          cd NullMoth/gpu-port/xkpi
          # A small header-only check catches shared include-tree problems
          # before launching upstream's 900-source parallel compile.
          kf="$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/Kernel.framework/Headers"
          printf '#include <compat/linuxkpi/common/include/linux/compiler_attributes.h>\n' | \
            xcrun clang -arch x86_64 -x c -E -nostdinc \
              -I"$kf" -I"$GITHUB_WORKSPACE/freebsd-src/sys" - \
              > "$GITHUB_WORKSPACE/ci-logs/kernel-header-preflight.i"
          echo 'FreeBSD LinuxKPI compiler_attributes.h: resolvable'
          echo 'LinuxKPI UUID namespace shim:'
          cat bsdcompat/include/nmxkpi_linux_uuid_namespace.h

          # Probe exactly one real kernel source with both the forced LinuxKPI
          # headers and the rest of the upstream compiler command.
          src="$GITHUB_WORKSPACE/drm-kmod/drivers/gpu/drm/drm_client.c"
          echo "Probing $src"
          if ! bash ./cc.sh "$src" > "$GITHUB_WORKSPACE/ci-logs/kernel-drm-probe.log" 2>&1; then
            echo 'DRM compiler probe failed. First errors:' >&2
            grep -m 20 -E 'fatal error:|error:' "$GITHUB_WORKSPACE/ci-logs/kernel-drm-probe.log" >&2 || \
              tail -n 80 "$GITHUB_WORKSPACE/ci-logs/kernel-drm-probe.log" >&2
            exit 1
          fi
          test -s obj/drm_client.o
          echo 'DRM compiler probe succeeded.'

      - name: Compile DRM core, TTM and dma-buf
        shell: bash
        run: |
          set -euo pipefail
          cd NullMoth/gpu-port/xkpi
          # Avoid falsely succeeding because a previous repository snapshot
          # happened to contain prebuilt obj/ objects.
          find obj -maxdepth 1 -type f -name '*.o' -delete
          # Upstream's summary ends in a grep pipeline that exits 1 if
          # *no* error lines exist. Inspect .failed and outputs instead.
          set +e
          bash all.sh 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/kernel-drm.log"
          build_status=${PIPESTATUS[0]}
          set -e
          echo "Upstream DRM script status: $build_status"
          test -s srcs.txt || { echo 'No DRM sources enumerated' >&2; exit 1; }
          if [ "$build_status" -gt 1 ]; then
            echo "DRM script exited unexpectedly ($build_status)" >&2
            exit "$build_status"
          fi
          if find logs -name '*.failed' -print -quit | grep -q .; then
            echo 'DRM compile errors:' >&2
            find logs -name '*.failed' -print >&2
            exit 1
          fi
          python3.14 - <<'PY'
          from pathlib import Path
          sources = [Path(s) for s in Path('srcs.txt').read_text().splitlines() if s.strip()]
          if len(sources) != 87:
              raise SystemExit(f'Expected 87 shared DRM sources; found {len(sources)}')
          objects = list(Path('obj').glob('*.o'))
          if len(objects) != 87:
              raise SystemExit(f'Expected 87 freshly compiled DRM objects; found {len(objects)}')
          missing = [s.name for s in sources if not (Path('obj') / (s.stem + '.o')).is_file()]
          if missing:
              raise SystemExit('Missing DRM outputs: ' + ', '.join(missing))
          print('DRM outputs verified:', len(sources))
          PY

      - name: Compile Intel i915
        shell: bash
        run: |
          set -euo pipefail
          cd NullMoth/gpu-port/xkpi
          find obj-i915 -maxdepth 1 -type f -name '*.o' -delete
          # See DRM step: exit 1 can mean grep found no errors.
          set +e
          bash all-i915.sh 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/kernel-i915.log"
          build_status=${PIPESTATUS[0]}
          set -e
          echo "Upstream i915 script status: $build_status"
          test -s srcs-i915.txt || { echo 'No i915 sources enumerated' >&2; exit 1; }
          if [ "$build_status" -gt 1 ]; then
            echo "i915 script exited unexpectedly ($build_status)" >&2
            exit "$build_status"
          fi
          if find logs-i915 -name '*.failed' -print -quit | grep -q .; then
            echo 'i915 compile errors:' >&2
            find logs-i915 -name '*.failed' -print >&2
            exit 1
          fi
          python3.14 - <<'PY'
          from pathlib import Path
          sources = [Path(s) for s in Path('srcs-i915.txt').read_text().splitlines() if s.strip()]
          missing = [s.name for s in sources if not (Path('obj-i915') / (s.stem + '.o')).is_file()]
          if missing:
              raise SystemExit('Missing i915 outputs: ' + ', '.join(missing))
          print('i915 outputs verified:', len(sources))
          PY

      - name: Inventory kernel objects and select linker
        id: kernel
        shell: bash
        env:
          LINKER_INPUT: ${{ inputs.kernel_linker || 'auto' }}
        run: |
          set -euo pipefail
          x='NullMoth/gpu-port/xkpi'
          total=0
          for dir in obj obj-i915 lkobj srcobj xnuobj; do
            n=$(find "$x/$dir" -maxdepth 1 -type f -name '*.o' | wc -l | tr -d ' ')
            echo "$dir: $n objects"
            total=$((total+n))
          done
          echo "Total kernel objects: $total"
          if [ "$total" -ne 438 ]; then
            echo "ERROR: frozen upstream kernel linker expects 438 objects, found $total" >&2
            echo 'Expected 87 DRM/TTM + 274 i915 + 49 LinuxKPI + 18 compat + 10 XNU.' >&2
            exit 1
          fi
          if [ "$LINKER_INPUT" != auto ]; then
            revision="$LINKER_INPUT"
          elif [ -f desktop-sources/link-kernel-1.0.15.py ]; then
            revision=1.0.15
          else
            revision=1.0.14
          fi
          linker="desktop-sources/link-kernel-$revision.py"
          test -f "$linker" || { echo "Requested upstream linker missing: $linker" >&2; exit 1; }
          echo "linker=$linker" >> "$GITHUB_OUTPUT"
          echo "Selected kernel linker: $linker"

      - name: Link NMXGPU and validate Mach-O output
        shell: bash
        env:
          KERNEL_LINKER: ${{ steps.kernel.outputs.linker }}
        run: |
          set -euo pipefail
          # The upstream 1.0.15 script links its new binary first, then
          # unconditionally uses nm on a developer-specific 1.0.8 baseline.
          # GitHub Actions does not include that baseline. Keep the ABI
          # comparison when it is available, but do not fail a valid link
          # simply because the optional regression fixture is absent.
          python3.14 - "$KERNEL_LINKER" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          script = Path(sys.argv[1])
          source = script.read_text()
          marker = "a=undefined(r/'desktop-build/NMXGPU-1.0.8')"
          matches = [i for i, line in enumerate(source.splitlines(keepends=True)) if marker in line]
          if not matches:
              if script.name == 'link-kernel-1.0.15.py':
                  raise SystemExit('Upstream NMXGPU 1.0.15 ABI check changed; review linker before patching')
              print(f'No known 1.0.8 ABI fixture check in {script}; leaving linker unchanged')
          elif len(matches) != 1:
              raise SystemExit('Ambiguous NMXGPU 1.0.8 ABI checks; refusing automatic edit')
          else:
              lines = source.splitlines(keepends=True)
              index = matches[0]
              line = lines[index]
              indent = line[:len(line) - len(line.lstrip())]
              if 'assert b-a <=' not in line or 'undefined(out)' not in line:
                  raise SystemExit('Unexpected upstream linker ABI check: ' + line.strip())
              replacement = textwrap.dedent('''\
              baseline = r / 'desktop-build/NMXGPU-1.0.8'
              b = undefined(out)
              if baseline.is_file():
                  a = undefined(baseline)
                  print('New imports:', sorted(b - a))
                  print('Removed imports:', sorted(a - b))
                  assert b - a <= {'__ZN9IOService11getPlatformEv'}, b - a
              else:
                  print('ABI regression comparison skipped: missing', baseline)
                  print('Newly linked undefined imports:', len(b))
              ''')
              lines[index] = ''.join(indent + text + '\n' for text in replacement.rstrip('\n').split('\n'))
              patched = ''.join(lines)
              compile(patched, str(script), 'exec')
              script.write_text(patched)
              print(f'Guarded optional ABI baseline comparison in {script}')
